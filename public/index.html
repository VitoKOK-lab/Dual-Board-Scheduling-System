<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBFBFC">
<meta name="description" content="雙板動態排班系統：黑板週矩陣與白板區域矩陣，一鍵自動排班、公平輪替與 Plan B 雙層備援。">
<title>雙板排班</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FBFBFC'/%3E%3Crect x='5' y='7' width='9' height='18' rx='3' fill='%232F5FD0'/%3E%3Crect x='18' y='7' width='9' height='18' rx='3' fill='%230F9B8E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<!-- ─── SVG icon sprite（不使用 emoji 作為圖示） ─── -->
<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
  <symbol id="i-board" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 21h8M12 18v3"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.2-2.9 7.9-7 9-4.1-1.1-7-4.8-7-9V6z"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 8v5M12 17h.01"/><circle cx="12" cy="12" r="9"/></symbol>
  <symbol id="i-swap" viewBox="0 0 24 24"><path d="M4 8h13l-3-3M20 16H7l3 3"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-3-6z"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M4 9h11a5 5 0 010 10h-6M4 9l4-4M4 9l4 4"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
</svg>

<!-- ─── 頂部列：週次切換 + 發布 ─── -->
<header class="appbar" id="appbar">
  <div class="appbar__row">
    <div class="appbar__title">
      <h1>雙板排班</h1>
      <span class="status-chip" id="statusChip" data-status="DRAFT">草稿</span>
    </div>
    <button class="btn btn--primary btn--sm" id="publishBtn" type="button">
      <svg class="icon" aria-hidden="true"><use href="#i-send"/></svg><span id="publishLabel">發布</span>
    </button>
  </div>
  <div class="weekbar">
    <button class="iconbtn" id="prevWeek" type="button" aria-label="上一週">
      <svg class="icon" aria-hidden="true"><use href="#i-prev"/></svg>
    </button>
    <button class="weekbar__label" id="weekLabel" type="button" aria-label="回到本週">
      <span class="weekbar__range mono" id="weekRange">—</span>
      <span class="weekbar__hint" id="weekHint">本週</span>
    </button>
    <button class="iconbtn" id="nextWeek" type="button" aria-label="下一週">
      <svg class="icon" aria-hidden="true"><use href="#i-next"/></svg>
    </button>
  </div>
  <nav class="daystrip" id="dayStrip" aria-label="選擇星期"></nav>
</header>

<main class="screen" id="screen">
  <!-- 黑板 -->
  <section class="view" id="view-blackboard" data-view="blackboard"></section>
  <!-- 白板 -->
  <section class="view" id="view-whiteboard" data-view="whiteboard" hidden></section>
  <!-- 備援 -->
  <section class="view" id="view-standby" data-view="standby" hidden></section>
  <!-- 統計 -->
  <section class="view" id="view-stats" data-view="stats" hidden></section>
</main>

<!-- ─── 底部導覽 + 中央主要動作 ─── -->
<nav class="tabbar" aria-label="主要導覽">
  <button class="tab is-active" data-tab="blackboard" type="button" aria-current="page">
    <svg class="icon" aria-hidden="true"><use href="#i-board"/></svg><span>黑板</span>
  </button>
  <button class="tab" data-tab="whiteboard" type="button">
    <svg class="icon" aria-hidden="true"><use href="#i-grid"/></svg><span>白板</span>
  </button>
  <button class="fab" id="generateBtn" type="button" aria-label="一鍵自動排班">
    <svg class="icon" aria-hidden="true"><use href="#i-bolt"/></svg>
  </button>
  <button class="tab" data-tab="standby" type="button">
    <svg class="icon" aria-hidden="true"><use href="#i-shield"/></svg><span>備援</span>
  </button>
  <button class="tab" data-tab="stats" type="button">
    <svg class="icon" aria-hidden="true"><use href="#i-chart"/></svg><span>統計</span>
  </button>
</nav>

<!-- ─── Bottom sheet ─── -->
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet__grab" aria-hidden="true"></div>
  <header class="sheet__head">
    <div>
      <h2 id="sheetTitle">—</h2>
      <p class="sheet__sub" id="sheetSub"></p>
    </div>
    <button class="iconbtn" id="sheetClose" type="button" aria-label="關閉">
      <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>
    </button>
  </header>
  <div class="sheet__body" id="sheetBody"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="loading" id="loading" hidden aria-hidden="true"><span class="spinner"></span></div>

<script src="./app.js" type="module"></script>
</body>
</html>

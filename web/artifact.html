<title>雙板排班</title>
<meta name="description" content="數位化實體黑板與白板的排班看板：一鍵自動排班、公平輪替、Plan B 雙層備援。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap">
<style>
/* ============================================================
   雙板動態排班系統 — 手機介面樣式
   基調：米白 #FBFBFC、柔和圓角卡片、寶石色編碼、低文字密度
   內文 Noto Sans TC；所有數字使用 Space Mono（等寬對齊）
   ============================================================ */

/* ---- 1. 設計 token ---- */
:root {
  /* 表面 */
  --bg: #FBFBFC;
  --surface: #FFFFFF;
  --sunken: #F3F3F7;
  --track: #EDEDF3;
  --track-active: #FFFFFF;
  --border: #E7E7EF;
  --border-strong: #D6D6E2;

  /* 文字 */
  --ink: #1B1B24;
  --ink-2: #56566A;
  --ink-3: #6B6B80;

  /* 寶石色 — 翡翠＝早修，紫水晶＝午休，藍寶石＝黑板，黃玉＝備援，紅寶石＝缺額 */
  --emerald: #0F9B8E;   --emerald-ink: #086158;   --emerald-soft: #E3F4F1;
  --amethyst: #6D4AD6;  --amethyst-ink: #4E2FB0;  --amethyst-soft: #EDE8FC;
  --sapphire: #2F5FD0;  --sapphire-ink: #1F4198;  --sapphire-soft: #E6EDFB;
  --topaz: #C08416;     --topaz-ink: #7C520A;     --topaz-soft: #FAF0DC;
  --graphite: #6B6B80;  --graphite-ink: #40404F;  --graphite-soft: #EDEDF2;
  --ruby: #C0344B;      --ruby-ink: #97213A;      --ruby-soft: #FBE7EB;

  /* 圓角與陰影 */
  --r-xl: 26px; --r-lg: 20px; --r-md: 14px; --r-sm: 10px;
  --shadow-card: 0 1px 2px rgba(27, 27, 36, .04), 0 8px 24px rgba(27, 27, 36, .06);
  --shadow-float: 0 6px 16px rgba(27, 27, 36, .10), 0 18px 40px rgba(27, 27, 36, .14);

  /* 間距節奏 4 / 8 */
  --gutter: 16px;
  --tabbar-h: 68px;

  /* 動態 */
  --ease-out: cubic-bezier(.22, 1, .36, 1);
  --dur: 220ms;

  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131319;
    --surface: #1C1C24;
    --sunken: #24242E;
    --track: #101016;
    --track-active: #333342;
    --border: #2E2E3A;
    --border-strong: #3C3C4B;
    --ink: #F2F2F6;
    --ink-2: #B4B4C4;
    --ink-3: #8A8A9C;
    --emerald: #3FC9B9;  --emerald-ink: #7FE0D3;  --emerald-soft: #10352F;
    --amethyst: #A98CF5; --amethyst-ink: #C3AEFF; --amethyst-soft: #292048;
    --sapphire: #7CA1F0; --sapphire-ink: #A3BEF7; --sapphire-soft: #1B2A4C;
    --topaz: #E0A93F;    --topaz-ink: #F0C878;    --topaz-soft: #3A2C10;
    --graphite: #9A9AAE; --graphite-ink: #C9C9D6;  --graphite-soft: #2A2A36;
    --ruby: #EE7C90;     --ruby-ink: #F7A3B1;     --ruby-soft: #3D1A22;
    --shadow-card: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
    --shadow-float: 0 8px 20px rgba(0, 0, 0, .45), 0 20px 44px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}

/* ---- 2. 基底 ---- */
*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  font-size: 16px;
  line-height: 1.55;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}

h1, h2, h3 { margin: 0; font-weight: 700; line-height: 1.35; }

p { margin: 0; }

button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }

/* hidden 屬性必須勝過元件自身的 display 宣告，否則隱藏的遮罩層仍會攔截點擊 */
[hidden] { display: none !important; }

.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

.icon {
  width: 22px; height: 22px; flex: none;
  fill: none; stroke: currentColor; stroke-width: 1.75;
  stroke-linecap: round; stroke-linejoin: round;
}

.mono { font-family: 'Space Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace; font-variant-numeric: tabular-nums; }

:where(button, a, [tabindex]):focus-visible {
  outline: 3px solid var(--sapphire);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}

.visually-hidden {
  position: absolute; width: 1px; height: 1px; margin: -1px;
  overflow: hidden; clip-path: inset(50%); white-space: nowrap;
}

/* ---- 3. 頂部列 ---- */
.appbar {
  position: sticky; top: 0; z-index: 40;
  padding: calc(var(--safe-top) + 10px) var(--gutter) 0;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(1.6) blur(14px);
  border-bottom: 1px solid var(--border);
}

.appbar__row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

.appbar__actions { display: flex; align-items: center; gap: 2px; }
.appbar__title { display: flex; align-items: center; gap: 8px; min-width: 0; }
.appbar__title h1 { font-size: 19px; letter-spacing: .02em; }

.status-chip {
  padding: 3px 10px; border-radius: 999px;
  font-size: 12px; font-weight: 700; white-space: nowrap;
  background: var(--sunken); color: var(--ink-2);
}
.status-chip[data-status="PUBLISHED"] { background: var(--emerald-soft); color: var(--emerald-ink); }
.status-chip[data-status="DRAFT"] { background: var(--topaz-soft); color: var(--topaz-ink); }

.weekbar { display: flex; align-items: center; gap: 4px; margin-top: 6px; }

.weekbar__label {
  flex: 1; min-height: 44px; padding: 4px 8px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: none; border: 0; border-radius: var(--r-md);
}
.weekbar__range { font-size: 17px; font-weight: 700; letter-spacing: .01em; }
.weekbar__hint { font-size: 11px; color: var(--ink-3); }

.iconbtn {
  width: 44px; height: 44px; flex: none;
  display: grid; place-items: center;
  background: none; border: 0; border-radius: 50%;
  color: var(--ink-2);
  transition: background var(--dur) var(--ease-out);
}
.iconbtn:active { background: var(--sunken); }

/* 星期條 */
.daystrip {
  display: flex; gap: 8px;
  padding: 4px 0 10px;
  overflow-x: auto; scrollbar-width: none;
  scroll-snap-type: x proximity;
}
.daystrip::-webkit-scrollbar { display: none; }

.daychip {
  flex: 1 0 auto; min-width: 58px; min-height: 54px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  padding: 6px 10px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md);
  color: var(--ink-2); scroll-snap-align: center;
  transition: transform var(--dur) var(--ease-out), background var(--dur) var(--ease-out), border-color var(--dur) var(--ease-out);
}
.daychip__d { font-size: 13px; font-weight: 500; }
.daychip__n { font-size: 15px; font-weight: 700; }
.daychip[aria-pressed="true"] {
  background: var(--ink); border-color: var(--ink); color: var(--bg);
}
.daychip[data-today="1"]::after {
  content: ''; width: 4px; height: 4px; border-radius: 50%;
  background: currentColor; opacity: .7;
}
.daychip:active { transform: scale(.96); }
.daychip[data-absent="1"] .daychip__n { color: inherit; }

/* ---- 4. 內容區 ---- */
.screen {
  padding: 16px var(--gutter) calc(var(--tabbar-h) + var(--safe-bottom) + 28px);
  max-width: 640px; margin: 0 auto;
}

.view { display: flex; flex-direction: column; gap: 16px; }

.section-head {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  padding: 0 4px;
}
.section-head h2 { font-size: 13px; font-weight: 700; letter-spacing: .08em; color: var(--ink-3); }
.section-head__meta { font-size: 12px; color: var(--ink-3); }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow-card);
  padding: 16px;
}
.card--flush { padding: 8px 16px; }

.card__title { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.card__title h3 { font-size: 16px; }

.badge {
  padding: 2px 9px; border-radius: 999px;
  font-size: 11px; font-weight: 700; white-space: nowrap;
}
.badge--emerald  { background: var(--emerald-soft);  color: var(--emerald-ink); }
.badge--amethyst { background: var(--amethyst-soft); color: var(--amethyst-ink); }
.badge--sapphire { background: var(--sapphire-soft); color: var(--sapphire-ink); }
.badge--topaz    { background: var(--topaz-soft);    color: var(--topaz-ink); }
.badge--ruby     { background: var(--ruby-soft);     color: var(--ruby-ink); }
.badge--graphite { background: var(--graphite-soft); color: var(--graphite-ink); }

/* 任務列（黑板） */
.duty {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 0;
  border-top: 1px solid var(--border);
}
.duty:first-child { border-top: 0; }
.duty__label { flex: none; width: 84px; font-size: 14px; font-weight: 500; color: var(--ink-2); }
.duty__slots { display: flex; flex-wrap: wrap; gap: 8px; flex: 1; }

/* 白板點位列 */
.spot-row {
  display: flex; align-items: center; gap: 12px;
  padding: 9px 0; border-top: 1px solid var(--border);
}
.spot-row:first-child { border-top: 0; }
.spot-row__name { flex: none; width: 112px; font-size: 14px; font-weight: 700; line-height: 1.3; }
.spot-row .spot__tags { flex: 1; }
.spot-row .dots { flex: none; flex-direction: column; gap: 3px; }

/* 白板點位卡（保留給單點檢視） */
.spot { display: flex; flex-direction: column; gap: 10px; }
.spot__head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.spot__name { font-size: 16px; font-weight: 700; }
.spot__meter { display: flex; align-items: center; gap: 8px; }
.spot__count { font-size: 12px; color: var(--ink-3); }
.dots { display: flex; gap: 4px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border-strong); }
.dot--on { background: var(--accent, var(--emerald)); }
.spot__tags { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---- 5. 名牌 chip ---- */
.tag {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 44px; padding: 6px 14px;
  background: var(--chip-bg, var(--sunken));
  color: var(--chip-ink, var(--ink));
  border: 1px solid transparent;
  border-radius: 999px;
  font-size: 15px; font-weight: 500;
  transition: transform 140ms var(--ease-out), box-shadow var(--dur) var(--ease-out);
  touch-action: none;
}
.tag[data-board="MORNING"]    { --chip-bg: var(--emerald-soft);  --chip-ink: var(--emerald-ink); }
.tag[data-board="FLAG"]       { --chip-bg: var(--topaz-soft);    --chip-ink: var(--topaz-ink); }
.tag[data-board="NOON"]       { --chip-bg: var(--amethyst-soft); --chip-ink: var(--amethyst-ink); }
.tag[data-board="BLACKBOARD"] { --chip-bg: var(--sapphire-soft); --chip-ink: var(--sapphire-ink); }
.tag[data-board="STANDBY"]    { --chip-bg: var(--graphite-soft); --chip-ink: var(--graphite-ink); }

.tag:active { transform: scale(.96); }

.tag--empty {
  --chip-bg: transparent; --chip-ink: var(--ruby-ink);
  border: 1.5px dashed var(--ruby);
  font-weight: 700;
}
.tag--override::after {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: currentColor; opacity: .55;
}
.tag--absent { text-decoration: line-through; opacity: .55; }
.tag--dragging { opacity: .35; }
.tag--dropzone { box-shadow: 0 0 0 3px var(--sapphire); }

.tag__ghost {
  position: fixed; z-index: 90; pointer-events: none;
  box-shadow: var(--shadow-float); transform: translate(-50%, -50%) scale(1.06);
}

/* ---- 6. 分段控制 ---- */
.segmented {
  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px;
  padding: 4px; background: var(--track); border-radius: 999px;
}
.segmented button {
  min-height: 44px; border: 0; border-radius: 999px;
  background: transparent; color: var(--ink-2);
  font-size: 15px; font-weight: 700;
  transition: background var(--dur) var(--ease-out), color var(--dur) var(--ease-out);
}
.segmented button[aria-selected="true"] { background: var(--track-active); box-shadow: var(--shadow-card); }
.segmented button[aria-selected="true"][data-shift="MORNING"] { color: var(--emerald-ink); }
.segmented button[aria-selected="true"][data-shift="FLAG"] { color: var(--topaz-ink); }
.segmented button[aria-selected="true"][data-shift="NOON"] { color: var(--amethyst-ink); }

/* ---- 7. 按鈕 ---- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 0 18px;
  border: 1px solid var(--border-strong); border-radius: 999px;
  background: var(--surface); color: var(--ink);
  font-size: 15px; font-weight: 700;
  transition: transform 140ms var(--ease-out), opacity var(--dur) var(--ease-out);
}
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .42; cursor: not-allowed; }
.btn--primary { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn--sm { min-height: 44px; padding: 0 14px; font-size: 14px; }
.btn--sm .icon { width: 17px; height: 17px; }
.btn--block { width: 100%; }
.btn--danger { color: var(--ruby-ink); border-color: var(--ruby); background: var(--ruby-soft); }
.btn--quiet { background: var(--sunken); border-color: transparent; color: var(--ink-2); }

/* ---- 8. 底部導覽 ---- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 45;
  display: grid; grid-template-columns: repeat(5, 1fr); align-items: center;
  height: calc(var(--tabbar-h) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: saturate(1.6) blur(14px);
  border-top: 1px solid var(--border);
}

.tab {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-height: 56px; border: 0; background: none;
  color: var(--ink-3); font-size: 11px; font-weight: 500;
  transition: color var(--dur) var(--ease-out);
}
.tab.is-active { color: var(--ink); font-weight: 700; }
.tab.is-active .icon { stroke-width: 2.2; }

.fab {
  justify-self: center;
  width: 58px; height: 58px; margin-top: -22px;
  display: grid; place-items: center;
  border: 0; border-radius: 50%;
  background: linear-gradient(140deg, var(--emerald), var(--amethyst));
  color: #FFFFFF;
  box-shadow: var(--shadow-float);
  transition: transform 160ms var(--ease-out);
}
.fab .icon { width: 26px; height: 26px; stroke-width: 2; }
.fab:active { transform: scale(.93); }
.fab:disabled { opacity: .5; }

/* ---- 9. Bottom sheet ---- */
.scrim {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(20, 20, 28, .5);
  animation: fade var(--dur) var(--ease-out);
}

.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 70;
  max-height: 86dvh; display: flex; flex-direction: column;
  padding-bottom: var(--safe-bottom);
  background: var(--surface);
  border-radius: var(--r-xl) var(--r-xl) 0 0;
  box-shadow: var(--shadow-float);
  animation: rise 280ms var(--ease-out);
}

.sheet__grab {
  width: 40px; height: 4px; margin: 8px auto 0;
  border-radius: 999px; background: var(--border-strong);
}
.sheet__head {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  padding: 10px var(--gutter) 8px;
}
.sheet__head h2 { font-size: 18px; }
.sheet__sub { font-size: 13px; color: var(--ink-3); }
.sheet__body {
  padding: 4px var(--gutter) 20px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  display: flex; flex-direction: column; gap: 12px;
}

/* 候選人列 */
.cand {
  display: flex; align-items: center; gap: 12px;
  width: 100%; min-height: 64px; padding: 12px 14px;
  background: var(--sunken); border: 1px solid transparent; border-radius: var(--r-lg);
  text-align: left;
}
.cand--best { background: var(--topaz-soft); border-color: color-mix(in srgb, var(--topaz) 40%, transparent); }
.cand__main { flex: 1; min-width: 0; }
.cand__name { font-size: 16px; font-weight: 700; }
.cand__why { font-size: 12px; color: var(--ink-3); display: flex; flex-wrap: wrap; gap: 6px; margin-top: 3px; }
.cand__num { font-size: 12px; color: var(--ink-3); margin-top: 4px; }
.cand > .icon { color: var(--ink-3); }

.field { display: flex; flex-direction: column; gap: 6px; }
.field > label { font-size: 13px; font-weight: 700; color: var(--ink-2); }
.field__hint { font-size: 12px; color: var(--ink-3); }
.field select, .field input[type="text"], .field input[type="date"], .field input[type="search"] {
  width: 100%; min-height: 48px; padding: 0 14px;
  font: inherit; font-size: 16px; color: var(--ink);
  background: var(--sunken); border: 1px solid var(--border); border-radius: var(--r-md);
}
.field__error { font-size: 13px; font-weight: 700; color: var(--ruby-ink); }

/* ---- 10. 統計 ---- */
.rings { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.rings--wide { grid-template-columns: repeat(4, 1fr); gap: 6px; }
.rings--wide svg { width: 62px; height: 62px; }
.rings--wide .ring__val { font-size: 15px; }
.ring { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.ring svg { width: 76px; height: 76px; transform: rotate(-90deg); }
.ring__track { fill: none; stroke: var(--sunken); stroke-width: 9; }
.ring__bar { fill: none; stroke-width: 9; stroke-linecap: round; transition: stroke-dashoffset 600ms var(--ease-out); }
.ring__val { font-size: 17px; font-weight: 700; }
.ring__label { font-size: 12px; color: var(--ink-3); }
.ring__range { font-size: 11px; color: var(--ink-3); }

.person {
  display: flex; align-items: center; gap: 12px;
  width: 100%; padding: 11px 4px; border: 0; border-top: 1px solid var(--border);
  background: none; text-align: left;
}
.person:first-child { border-top: 0; }
.person__name { flex: 1; min-width: 0; font-size: 15px; font-weight: 500; }
.person__name span { display: block; font-size: 11px; color: var(--ink-3); font-weight: 400; }
.person__bars { display: flex; gap: 3px; align-items: flex-end; height: 28px; width: 84px; }
.bar { flex: 1; border-radius: 3px 3px 0 0; min-height: 3px; }
.bar--bb { background: var(--sapphire); }
.bar--am { background: var(--emerald); }
.bar--fl { background: var(--topaz); }
.bar--pm { background: var(--amethyst); }
.bar--zero { background: var(--border-strong); }
.person__total { width: 30px; text-align: right; font-size: 15px; font-weight: 700; }
.person--off .person__name { color: var(--ink-3); text-decoration: line-through; }

.legend { display: flex; flex-wrap: wrap; gap: 12px; padding: 0 4px; font-size: 12px; color: var(--ink-3); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }

/* ---- 11. 空狀態 / 提示 ---- */
.empty {
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  padding: 40px 24px; text-align: center;
}
.empty .icon { width: 34px; height: 34px; color: var(--ink-3); }
.empty h3 { font-size: 17px; }
.empty p { font-size: 14px; color: var(--ink-3); max-width: 30ch; }

.notice {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 12px 14px; border-radius: var(--r-lg);
  background: var(--ruby-soft); color: var(--ruby-ink);
  font-size: 14px; font-weight: 500;
}
.notice .icon { width: 20px; height: 20px; margin-top: 1px; }
.notice--topaz { background: var(--topaz-soft); color: var(--topaz-ink); }

.rowlist { display: flex; flex-direction: column; }
.rowitem {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 0; border-top: 1px solid var(--border);
}
.rowitem:first-child { border-top: 0; }
.rowitem__main { flex: 1; min-width: 0; }
.rowitem__title { font-size: 15px; font-weight: 500; }
.rowitem__sub { font-size: 12px; color: var(--ink-3); }

/* ---- 12. Toast / loading ---- */
.toast {
  position: fixed; left: 50%; z-index: 80;
  bottom: calc(var(--tabbar-h) + var(--safe-bottom) + 16px);
  transform: translateX(-50%);
  max-width: calc(100vw - 32px);
  padding: 11px 18px; border-radius: 999px;
  background: var(--ink); color: var(--bg);
  font-size: 14px; font-weight: 500; text-align: center;
  box-shadow: var(--shadow-float);
  animation: rise 220ms var(--ease-out);
}
.toast[data-tone="error"] { background: var(--ruby-ink); color: #FFFFFF; }

.loading { position: fixed; inset: 0; z-index: 85; display: grid; place-items: center; background: rgba(251, 251, 252, .55); }
@media (prefers-color-scheme: dark) { .loading { background: rgba(19, 19, 25, .6); } }
.spinner {
  width: 34px; height: 34px; border-radius: 50%;
  border: 3px solid var(--border-strong); border-top-color: var(--amethyst);
  animation: spin 700ms linear infinite;
}

@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } }
@keyframes spin { to { transform: rotate(360deg); } }

.stagger > * { animation: rise 320ms var(--ease-out) backwards; }
.stagger > *:nth-child(1) { animation-delay: 20ms; }
.stagger > *:nth-child(2) { animation-delay: 60ms; }
.stagger > *:nth-child(3) { animation-delay: 100ms; }
.stagger > *:nth-child(4) { animation-delay: 140ms; }
.stagger > *:nth-child(5) { animation-delay: 180ms; }
.stagger > *:nth-child(n+6) { animation-delay: 210ms; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important; animation-iteration-count: 1 !important;
    transition-duration: .01ms !important; scroll-behavior: auto !important;
  }
}

/* ---- 13. 大螢幕：維持單欄手機版面並置中 ---- */
@media (min-width: 700px) {
  .tabbar { max-width: 640px; left: 50%; transform: translateX(-50%); border-radius: var(--r-xl) var(--r-xl) 0 0; }
  .sheet { max-width: 640px; left: 50%; transform: translateX(-50%); }
  .toast { bottom: calc(var(--tabbar-h) + 24px); }
}

/* ---- 14. 列印：輸出當週班表 ---- */
@media print {
  .appbar, .tabbar, .sheet, .scrim, .toast, .loading, .fab { display: none !important; }
  body { background: #FFFFFF; }
  .screen { padding: 0; max-width: none; }
  .view[hidden] { display: block !important; }
  .card { break-inside: avoid; box-shadow: none; }
}

/* 升旗時段內的分區標題（定點／巡查） */
.zone-head {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 4px 0;
}
.zone-head h3 { font-size: 14px; color: var(--ink-2); }
.zone-head::after {
  content: ''; flex: 1; height: 1px; background: var(--border);
}

/* ---- 15. 設定：點位與成員管理 ---- */
.admin-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 0; border-top: 1px solid var(--border);
}
.admin-row:first-child { border-top: 0; }
.admin-row__main { flex: 1; min-width: 0; }
/* 名稱列有改名鈕時，副標往上收，避免整列過高 */
.admin-row__name--edit + .admin-row__sub { margin-top: -6px; }
.admin-row__name { font-size: 15px; font-weight: 500; }
.admin-row__name--edit {
  display: flex; align-items: center; width: 100%; min-height: 44px; padding: 0;
  border: 0; background: none; text-align: left;
  text-decoration: underline; text-decoration-color: var(--border-strong);
  text-underline-offset: 4px;
}
.admin-row__rename { display: flex; align-items: center; gap: 4px; }
.admin-row__rename input {
  flex: 1; min-width: 0; min-height: 44px; padding: 0 12px;
  font: inherit; font-size: 16px; color: var(--ink);
  background: var(--sunken); border: 1px solid var(--sapphire); border-radius: var(--r-sm);
}
.admin-row__sub { font-size: 12px; color: var(--ink-3); }

.stepper { display: flex; align-items: center; gap: 2px; flex: none; }
.stepper button {
  width: 44px; height: 44px; display: grid; place-items: center;
  border: 0; background: none; border-radius: var(--r-sm); color: var(--ink-2);
}
.stepper button:disabled { opacity: .3; }
.stepper button:active { background: var(--sunken); }
.stepper .icon { width: 18px; height: 18px; }
.stepper__value { min-width: 22px; text-align: center; font-size: 15px; font-weight: 700; }

.admin-row__confirm { display: flex; gap: 6px; align-items: center; }
.admin-row__confirm span { font-size: 13px; color: var(--ruby-ink); font-weight: 700; margin-right: 2px; }

.admin-form { display: flex; flex-direction: column; gap: 10px; }
.admin-form__grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.admin-form__grid .field { min-width: 0; }

/* ---- 16. 班表表格 ---- */
.tablewrap {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  border-radius: var(--r-lg);
  border: 1px solid var(--border);
  background: var(--surface);
}

.sched {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
  font-variant-numeric: tabular-nums;
}

.sched th,
.sched td {
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  padding: 0;
  text-align: left;
  vertical-align: middle;
}
.sched th:last-child,
.sched td:last-child { border-right: 0; }
.sched tr:last-child td { border-bottom: 0; }

.sched thead th {
  padding: 9px 10px;
  background: var(--sunken);
  font-size: 12px; font-weight: 700; letter-spacing: .04em;
  color: var(--ink-2);
  white-space: nowrap;
}
.sched thead th:first-child { text-align: left; }

/* 列首（點位名／任務名） */
.sched th[scope="row"] {
  padding: 6px 10px;
  font-size: 13px; font-weight: 700; line-height: 1.3;
  color: var(--ink);
  background: color-mix(in srgb, var(--sunken) 55%, transparent);
  min-width: 96px;
}

/* 分區標題列（升旗的定點／巡查） */
.sched .zone-row th {
  padding: 7px 10px;
  background: var(--track);
  font-size: 12px; font-weight: 700; letter-spacing: .06em;
  color: var(--ink-2);
}

/* 名牌塞在儲存格裡，撐滿以擴大觸控區 */
.sched .tag {
  width: 100%;
  min-height: 42px;
  border-radius: 0;
  justify-content: flex-start;
  padding: 4px 10px;
  font-size: 14px;
  background: transparent;
  color: var(--chip-ink, var(--ink));
}
.sched .tag--empty { border: 0; color: var(--ruby-ink); }
.sched .tag--empty .icon { width: 16px; height: 16px; }
.sched .tag:active { transform: none; background: var(--sunken); }
.sched td:has(.tag--dropzone) { box-shadow: inset 0 0 0 2px var(--sapphire); }

/* 兩欄表（點位｜人員）固定比例，名稱長也不會把人員欄擠掉 */
.sched--pair th[scope="row"] { width: 58%; }

/* 黑板的每日欄位窄，字級再收一點 */
.sched--week th[scope="row"] { min-width: 62px; }
.sched--week td { min-width: 58px; }
.sched--week .tag { padding: 4px 6px; font-size: 13px; justify-content: center; }

.sched-caption {
  display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
  padding: 0 4px 6px;
}
.sched-caption h2 { font-size: 13px; font-weight: 700; letter-spacing: .08em; color: var(--ink-3); }
.sched-caption span { font-size: 12px; color: var(--ink-3); }

/* 公差表的操作欄 */
.sched td.cell-action { width: 44px; }
.sched td.cell-action .iconbtn { width: 44px; height: 44px; }
.sched .cell-text { padding: 8px 10px; }
.sched .cell-sub { display: block; font-size: 12px; color: var(--ink-3); }

/* ===== src/domain/week.js ===== */
/** 週別日期工具：全部以 UTC 計算，避免時區造成跨日誤差。 */

const DAY_MS = 86_400_000;

function isIsoDate(value) {
  return typeof value === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(value)
    && !Number.isNaN(Date.parse(`${value}T00:00:00Z`));
}

function toUtc(dateStr) {
  if (!isIsoDate(dateStr)) throw new Error(`無效日期格式（需 YYYY-MM-DD）：${dateStr}`);
  return new Date(`${dateStr}T00:00:00Z`);
}

function toIso(date) {
  return date.toISOString().slice(0, 10);
}

/** 取得該日期所屬週的週一（ISO 週，週日歸屬前一週的週一）。 */
function mondayOf(dateStr) {
  const d = toUtc(dateStr);
  const dow = d.getUTCDay();              // 0=Sun .. 6=Sat
  const shift = dow === 0 ? -6 : 1 - dow; // 週日往前 6 天
  return toIso(new Date(d.getTime() + shift * DAY_MS));
}

/** 週起始日 + day_of_week(1..5) → ISO 日期。 */
function dateForDay(weekStartDate, dayOfWeek) {
  if (!Number.isInteger(dayOfWeek) || dayOfWeek < 1 || dayOfWeek > 5) {
    throw new Error(`day_of_week 需為 1..5：${dayOfWeek}`);
  }
  return toIso(new Date(toUtc(weekStartDate).getTime() + (dayOfWeek - 1) * DAY_MS));
}

/** ISO 日期 → 該週的 day_of_week(1..5)；不在本週或為週末時回傳 null。 */
function dayOfWeekFor(weekStartDate, dateStr) {
  const diff = Math.round((toUtc(dateStr).getTime() - toUtc(weekStartDate).getTime()) / DAY_MS);
  return diff >= 0 && diff <= 4 ? diff + 1 : null;
}

/** 相對本週位移 n 週的週一。 */
function shiftWeeks(weekStartDate, weeks) {
  return toIso(new Date(toUtc(weekStartDate).getTime() + weeks * 7 * DAY_MS));
}

/** 今天所屬週的週一。 */
function currentWeekStart(today = new Date()) {
  return mondayOf(toIso(today));
}

/* ===== src/domain/fairness.js ===== */
/**
 * 公平性權重模組 —— 規格 §4.1「排序權重」。
 *
 * 設計原則：
 * 1. 全部為 deterministic 計算，同樣輸入必得同樣班表，可回放、可測試。
 * 2. 排序不只看歷史累計，也即時累加「本次生成已指派的次數」，
 *    避免同一輪演算法把所有工作塞給同一位歷史次數最低的人。
 * 3. 同分時以「週別輪轉序」打破平手，讓低 staff_id 不會長期佔便宜。
 */

const DIMENSION = {
  BLACKBOARD: 'blackboard',
  MORNING: 'morning',
  FLAG: 'flag',
  NOON: 'noon',
};

/** 四個任務維度，各自獨立排序與累計。 */
const WORK_DIMENSIONS = [DIMENSION.BLACKBOARD, DIMENSION.MORNING, DIMENSION.FLAG, DIMENSION.NOON];

/** fairness_stats 的欄位名對映。 */
const DIMENSION_COLUMN = {
  [DIMENSION.BLACKBOARD]: 'blackboard_count',
  [DIMENSION.MORNING]: 'morning_whiteboard_count',
  [DIMENSION.FLAG]: 'flag_whiteboard_count',
  [DIMENSION.NOON]: 'noon_whiteboard_count',
};

/**
 * 以週起始日推導輪轉種子：距 1970-01-01 的天數。
 * 每週前進 7，配合 rotate 讓平手順序逐週位移。
 */
function weekSeed(weekStartDate) {
  const ms = Date.parse(`${weekStartDate}T00:00:00Z`);
  if (Number.isNaN(ms)) throw new Error(`無效的週起始日：${weekStartDate}`);
  return Math.floor(ms / 86_400_000);
}

/**
 * 平手序位：把人員依 staff_id 排好後，整體旋轉 seed % n 格。
 * @returns {Map<number, number>} staff_id -> 序位（越小越優先）
 */
function buildTieRanks(staffList, weekStartDate) {
  const ids = staffList.map((s) => s.staff_id).sort((a, b) => a - b);
  const n = ids.length;
  const ranks = new Map();
  if (n === 0) return ranks;
  const offset = ((weekSeed(weekStartDate) % n) + n) % n;
  for (let i = 0; i < n; i += 1) {
    ranks.set(ids[(i + offset) % n], i);
  }
  return ranks;
}

/**
 * 負擔追蹤器：歷史統計 + 本週已指派量。
 */
class LoadTracker {
  constructor(staffList, statsByStaffId = new Map()) {
    this.load = new Map();
    for (const s of staffList) {
      const base = statsByStaffId.get(s.staff_id) ?? {};
      this.load.set(s.staff_id, {
        blackboard: base.blackboard_count ?? 0,
        morning: base.morning_whiteboard_count ?? 0,
        flag: base.flag_whiteboard_count ?? 0,
        noon: base.noon_whiteboard_count ?? 0,
        weekAssigned: 0,
      });
    }
  }

  #row(staffId) {
    let row = this.load.get(staffId);
    if (!row) {
      row = { blackboard: 0, morning: 0, flag: 0, noon: 0, weekAssigned: 0 };
      this.load.set(staffId, row);
    }
    return row;
  }

  get(staffId, dimension) {
    return this.#row(staffId)[dimension];
  }

  /** 累計工作量（不含待命次數）。 */
  total(staffId) {
    const r = this.#row(staffId);
    return r.blackboard + r.morning + r.flag + r.noon;
  }

  weekAssigned(staffId) {
    return this.#row(staffId).weekAssigned;
  }

  /** 指派一次任務，同步累加該維度與本週指派量。 */
  add(staffId, dimension, amount = 1) {
    const r = this.#row(staffId);
    r[dimension] += amount;
    r.weekAssigned += amount;
    return r;
  }

  snapshot() {
    return new Map([...this.load].map(([k, v]) => [k, { ...v }]));
  }
}

/**
 * 建立指定維度的比較器：該維度次數 → 總負擔 → 平手輪轉序。
 */
function comparatorFor(dimension, tracker, tieRanks) {
  return (a, b) => {
    const da = tracker.get(a.staff_id, dimension);
    const db = tracker.get(b.staff_id, dimension);
    if (da !== db) return da - db;

    const ta = tracker.total(a.staff_id);
    const tb = tracker.total(b.staff_id);
    if (ta !== tb) return ta - tb;

    const ra = tieRanks.get(a.staff_id) ?? a.staff_id;
    const rb = tieRanks.get(b.staff_id) ?? b.staff_id;
    if (ra !== rb) return ra - rb;

    return a.staff_id - b.staff_id;
  };
}

/* ===== src/domain/scheduler.js ===== */
/**
 * 一鍵自動排班引擎 —— 規格 §4。
 *
 * 純函式：輸入人員 / 點位字典 / 公平性統計 / 公差事件，輸出整週指派結果。
 * 不碰資料庫、不依賴時間，因此可完整單元測試與回放。
 *
 * 執行順序：
 *   A. 黑板全週職務（交接、值日生）
 *   B. 黑板每日職務（餐車、早修、午休、校表）
 *   C. 白板三個時段：早修 → 升旗 → 午休
 *      升旗底下的「定點」與「巡查」是同一時段的兩種任務，共用名額上限。
 *
 * 每個人都要有任務：所有可排班的師傅一律進入候選池，
 * 生成後若仍有人整週掛零會回報 IDLE_STAFF。
 *
 * 師徒制：只有「師傅」進入排班池。徒弟跟著自己的師傅學習，
 * 不排班、不計入點位人數，由主管手動升級為師傅後才會被排到班。
 *
 * 容量上限：每人每個時段只能站一個點位，因此單一時段的名額總數
 * 不能超過可排班的師傅數，超過的部分必然留空並回報 CAPACITY_EXCEEDED。
 */



/** 白板時段 → 公平性維度。 */
const SHIFT_DIMENSION = {
  [SHIFT.MORNING]: DIMENSION.MORNING,
  [SHIFT.FLAG]: DIMENSION.FLAG,
  [SHIFT.NOON]: DIMENSION.NOON,
};

function sortItems(items) {
  return [...items].sort((a, b) => (a.sort_order - b.sort_order) || (a.item_id - b.item_id));
}

function selectItems(items, boardType, shiftType) {
  return sortItems(items.filter((i) => i.board_type === boardType && i.shift_type === shiftType));
}

/**
 * 本週狀態機：追蹤誰在哪一天、哪一個時段、哪一個點位已被佔用。
 */
class WeekState {
  constructor() {
    this.absent = new Set();             // `${staffId}:${day}`
    this.allWeekHolders = new Set();     // 已擔任全週職務者
    this.blackboardByDay = new Map();    // day -> Set<staffId>
    this.shiftByDay = new Map();         // `${shift}:${day}` -> Set<staffId>，該時段已排到的人
    this.spotsByDay = new Map();         // day -> Map<staffId, Set<item_name>>，當日已站過的點位
    for (const d of WEEK_DAYS) {
      this.blackboardByDay.set(d, new Set());
      this.spotsByDay.set(d, new Map());
      for (const shift of WHITEBOARD_SHIFTS) this.shiftByDay.set(`${shift}:${d}`, new Set());
    }
  }

  /** 該員當日在此時段是否已有點位。 */
  isOnShift(staffId, shift, day) {
    return this.shiftByDay.get(`${shift}:${day}`).has(staffId);
  }

  /** 該員當日是否已站過同名點位（跨時段不重複）。 */
  hasSpot(staffId, day, itemName) {
    return this.spotsByDay.get(day).get(staffId)?.has(itemName) ?? false;
  }

  place(staffId, shift, day, itemName) {
    this.shiftByDay.get(`${shift}:${day}`).add(staffId);
    const spots = this.spotsByDay.get(day);
    if (!spots.has(staffId)) spots.set(staffId, new Set());
    spots.get(staffId).add(itemName);
  }

  markAbsent(staffId, day) {
    this.absent.add(`${staffId}:${day}`);
  }

  isAbsent(staffId, day) {
    return this.absent.has(`${staffId}:${day}`);
  }

  isAbsentAnyDay(staffId) {
    return WEEK_DAYS.some((d) => this.isAbsent(staffId, d));
  }
}

/** 把公差事件轉成「人員 x 星期」的缺席標記。 */
function applyAbsences(state, absences, weekStartDate) {
  for (const a of absences ?? []) {
    const day = a.day_of_week ?? dayOfWeekFor(weekStartDate, a.absence_date);
    if (day) state.markAbsent(a.staff_id, day);
  }
}

/**
 * 依序套用多層候選條件，第一層為硬性 + 軟性限制，
 * 後續層逐步放寬軟性限制；硬性限制永不放寬。
 * @returns {{ staff: object|null, relaxed: boolean }}
 */
function pickCandidate(pool, filters, comparator) {
  for (let level = 0; level < filters.length; level += 1) {
    const candidates = pool.filter(filters[level]);
    if (candidates.length > 0) {
      candidates.sort(comparator);
      return { staff: candidates[0], relaxed: level > 0 };
    }
  }
  return { staff: null, relaxed: false };
}

function generateWeeklyPlan({
  staff = [],
  items = [],
  stats = new Map(),
  absences = [],
  weekStartDate,
}) {
  if (!weekStartDate) throw new Error('generateWeeklyPlan 需要 weekStartDate');

  // 排班池只有師傅；徒弟不排班也不計入點位人數
  const pool = staff.filter((s) => s.is_active && s.role === ROLE.MASTER);
  const statsMap = stats instanceof Map ? stats : new Map(Object.entries(stats).map(([k, v]) => [Number(k), v]));

  const state = new WeekState();
  applyAbsences(state, absences, weekStartDate);

  const tracker = new LoadTracker(pool, statsMap);
  const tieRanks = buildTieRanks(pool, weekStartDate);
  const blackboardCmp = comparatorFor(DIMENSION.BLACKBOARD, tracker, tieRanks);

  const assignments = [];
  const warnings = [];

  const warn = (code, detail) => warnings.push({ code, ...detail });

  // ---------------------------------------------------------------
  // A. 黑板 — 全週固定職務（交接、值日生），各 1 人、1 週 1 次
  // ---------------------------------------------------------------
  for (const item of selectItems(items, BOARD.BLACKBOARD, SHIFT.ALL_WEEK)) {
    for (let slot = 0; slot < item.required_capacity; slot += 1) {
      const { staff: chosen, relaxed } = pickCandidate(
        pool,
        [
          // 硬性：未擔任其他全週職務；軟性：整週皆可出勤
          (s) => !state.allWeekHolders.has(s.staff_id) && !state.isAbsentAnyDay(s.staff_id),
          (s) => !state.allWeekHolders.has(s.staff_id),
        ],
        blackboardCmp,
      );

      if (!chosen) {
        warn(WARNING.UNDERSTAFFED, { item_id: item.item_id, item_name: item.item_name, day_of_week: null });
        assignments.push({ item_id: item.item_id, staff_id: null, day_of_week: null, slot_index: slot });
        continue;
      }
      if (relaxed) {
        warn(WARNING.CONSTRAINT_RELAXED, {
          item_id: item.item_id, item_name: item.item_name, day_of_week: null, staff_id: chosen.staff_id,
          reason: '本週有公差紀錄仍指派全週職務',
        });
      }

      state.allWeekHolders.add(chosen.staff_id);
      tracker.add(chosen.staff_id, DIMENSION.BLACKBOARD);
      assignments.push({ item_id: item.item_id, staff_id: chosen.staff_id, day_of_week: null, slot_index: slot });
    }
  }

  // ---------------------------------------------------------------
  // B. 黑板 — 每日輪替職務（餐車、早修、午休、校表）
  // ---------------------------------------------------------------
  const dailyItems = selectItems(items, BOARD.BLACKBOARD, SHIFT.DAILY);
  for (const day of WEEK_DAYS) {
    const taken = state.blackboardByDay.get(day);
    for (const item of dailyItems) {
      for (let slot = 0; slot < item.required_capacity; slot += 1) {
        const { staff: chosen, relaxed } = pickCandidate(
          pool,
          [
            // 硬性：當日可出勤、當日尚未有黑板任務；軟性：非全週職務持有者
            (s) => !state.isAbsent(s.staff_id, day) && !taken.has(s.staff_id) && !state.allWeekHolders.has(s.staff_id),
            (s) => !state.isAbsent(s.staff_id, day) && !taken.has(s.staff_id),
          ],
          blackboardCmp,
        );

        if (!chosen) {
          warn(WARNING.UNDERSTAFFED, { item_id: item.item_id, item_name: item.item_name, day_of_week: day });
          assignments.push({ item_id: item.item_id, staff_id: null, day_of_week: day, slot_index: slot });
          continue;
        }
        if (relaxed) {
          warn(WARNING.CONSTRAINT_RELAXED, {
            item_id: item.item_id, item_name: item.item_name, day_of_week: day, staff_id: chosen.staff_id,
            reason: '全週職務者兼任當日黑板任務',
          });
        }

        taken.add(chosen.staff_id);
        tracker.add(chosen.staff_id, DIMENSION.BLACKBOARD);
        assignments.push({ item_id: item.item_id, staff_id: chosen.staff_id, day_of_week: day, slot_index: slot });
      }
    }
  }

  // ---------------------------------------------------------------
  // C. 白板 —— 早修 → 升旗 → 午休
  // ---------------------------------------------------------------
  for (const shift of WHITEBOARD_SHIFTS) {
    const shiftItems = selectItems(items, BOARD.WHITEBOARD, shift);
    if (shiftItems.length === 0) continue;

    const demand = shiftItems.reduce((sum, i) => sum + i.required_capacity, 0);
    const comparator = comparatorFor(SHIFT_DIMENSION[shift], tracker, tieRanks);

    // 每人每個時段只能站一個點位，供給上限就是可排班人數
    if (demand > pool.length) {
      warn(WARNING.CAPACITY_EXCEEDED, {
        shift_type: shift,
        shift_label: SHIFT_LABEL[shift] ?? shift,
        required: demand,
        available: pool.length,
        shortfall: demand - pool.length,
      });
    }

    for (const item of shiftItems) {
      for (const day of WEEK_DAYS) {
        for (let slot = 0; slot < item.required_capacity; slot += 1) {
          const { staff: chosen } = pickCandidate(
            pool,
            [
              // 硬性：當日可出勤、該時段尚未有點位、當日未站過同名點位
              (s) => !state.isAbsent(s.staff_id, day)
                && !state.isOnShift(s.staff_id, shift, day)
                && !state.hasSpot(s.staff_id, day, item.item_name),
            ],
            comparator,
          );

          if (!chosen) {
            warn(WARNING.UNDERSTAFFED, {
              item_id: item.item_id, item_name: item.item_name,
              day_of_week: day, shift_type: shift,
            });
            assignments.push({ item_id: item.item_id, staff_id: null, day_of_week: day, slot_index: slot });
            continue;
          }

          state.place(chosen.staff_id, shift, day, item.item_name);
          tracker.add(chosen.staff_id, SHIFT_DIMENSION[shift]);
          assignments.push({ item_id: item.item_id, staff_id: chosen.staff_id, day_of_week: day, slot_index: slot });
        }
      }
    }
  }

  // 每個人都要有任務：整週掛零的人要讓主管看見
  const idle = pool.filter((s) => tracker.weekAssigned(s.staff_id) === 0);
  if (idle.length > 0) {
    warn(WARNING.IDLE_STAFF, {
      staff_ids: idle.map((s) => s.staff_id),
      names: idle.map((s) => s.name),
    });
  }

  return {
    weekStartDate,
    assignments: assignments.map((a) => ({
      is_override: 0,
      ...a,
    })),
    warnings,
    load: tracker.snapshot(),
  };
}

/* ===== src/domain/planX.js ===== */
/**
 * Plan X 動態補位 —— 規格 §2.3。
 *
 * 主管點擊名牌換人時，依當前負擔由輕到重推薦可用的師傅。
 * 同時提供覆寫衝突檢查：規格 §1 明訂主管具 100% 強制覆寫權，
 * 因此本模組只「回報衝突」，不阻擋指派。
 */




const CONFLICT = {
  INACTIVE: 'INACTIVE',                 // 人員已停用
  ABSENT: 'ABSENT',                     // 當日有公差 / 請假
  DUPLICATE_SHIFT: 'DUPLICATE_SHIFT',   // 當日同時段已有其他點位
  SAME_LOCATION: 'SAME_LOCATION',       // 當日已站過同一個點位
  BLACKBOARD_DOUBLE: 'BLACKBOARD_DOUBLE', // 當日已有其他黑板任務
  ALL_WEEK_HELD: 'ALL_WEEK_HELD',       // 已擔任全週職務
  ALREADY_HERE: 'ALREADY_HERE',         // 已在同一點位
  APPRENTICE: 'APPRENTICE',             // 徒弟尚未升級為師傅，不能排班
};

const CONFLICT_LABEL = {
  [CONFLICT.INACTIVE]: '人員已停用',
  [CONFLICT.ABSENT]: '當日有公差／請假',
  [CONFLICT.DUPLICATE_SHIFT]: '當日同時段已有點位',
  [CONFLICT.SAME_LOCATION]: '當日已站過同一點位',
  [CONFLICT.BLACKBOARD_DOUBLE]: '當日已有其他黑板任務',
  [CONFLICT.ALL_WEEK_HELD]: '已擔任全週職務',
  [CONFLICT.ALREADY_HERE]: '已在同一點位',
  [CONFLICT.APPRENTICE]: '徒弟，尚未升級為師傅',
};

function shiftOf(item) {
  if (!item) return null;
  if (item.board_type === BOARD.WHITEBOARD) return item.shift_type;
  return item.shift_type === SHIFT.ALL_WEEK ? SHIFT.ALL_WEEK : SHIFT.DAILY;
}

/**
 * 把班表列轉成查詢索引。
 * @param rows 班表明細（含 staff_id / item_id / day_of_week）
 * @param itemsById Map<item_id, location_task>
 */
function buildBoardIndex(rows, itemsById) {
  const index = {
    onShift: new Map(),       // `${shift}:${day}` -> Set<staffId>
    spots: new Map(),         // day -> Map<staffId, Set<item_name>>
    blackboardDaily: new Map(), // day -> Map<staffId, Set<item_id>>
    allWeek: new Map(),       // staffId -> Set<item_id>
    occupancy: new Map(),     // item_id -> Map<day|'ALL', Set<staffId>>
    weekAssigned: new Map(),  // staffId -> 本週被指派次數
  };
  for (const d of WEEK_DAYS) {
    index.spots.set(d, new Map());
    index.blackboardDaily.set(d, new Map());
    for (const shift of WHITEBOARD_SHIFTS) index.onShift.set(`${shift}:${d}`, new Set());
  }

  const push = (map, key, value) => {
    if (!map.has(key)) map.set(key, new Set());
    map.get(key).add(value);
  };

  for (const row of rows) {
    if (row.staff_id == null) continue;

    const item = itemsById.get(row.item_id);
    if (!item) continue;

    index.weekAssigned.set(row.staff_id, (index.weekAssigned.get(row.staff_id) ?? 0) + 1);

    const dayKey = row.day_of_week ?? 'ALL';
    if (!index.occupancy.has(row.item_id)) index.occupancy.set(row.item_id, new Map());
    push(index.occupancy.get(row.item_id), dayKey, row.staff_id);

    const shift = shiftOf(item);
    if (WHITEBOARD_SHIFTS.includes(shift)) {
      index.onShift.get(`${shift}:${row.day_of_week}`)?.add(row.staff_id);
      push(index.spots.get(row.day_of_week), row.staff_id, item.item_name);
    } else if (shift === SHIFT.DAILY) {
      push(index.blackboardDaily.get(row.day_of_week), row.staff_id, item.item_id);
    } else if (shift === SHIFT.ALL_WEEK) {
      push(index.allWeek, row.staff_id, item.item_id);
    }
  }

  return index;
}

function absentDays(absences, weekStartDate) {
  const set = new Set();
  for (const a of absences ?? []) {
    const day = a.day_of_week ?? dayOfWeekFor(weekStartDate, a.absence_date);
    if (day) set.add(`${a.staff_id}:${day}`);
  }
  return set;
}

/**
 * 檢查把 candidate 放進 targetItem/targetDay 會踩到哪些限制。
 * @returns {string[]} 衝突代碼陣列（空陣列代表完全合規）
 */
function checkConflicts({
  candidate, targetItem, targetDay, index, absentSet,
}) {
  const conflicts = [];
  const id = candidate.staff_id;

  if (!candidate.is_active) conflicts.push(CONFLICT.INACTIVE);
  if (candidate.role !== ROLE.MASTER) conflicts.push(CONFLICT.APPRENTICE);
  if (targetDay && absentSet.has(`${id}:${targetDay}`)) conflicts.push(CONFLICT.ABSENT);
  if (!targetDay && WEEK_DAYS.some((d) => absentSet.has(`${id}:${d}`))) conflicts.push(CONFLICT.ABSENT);

  const occupants = index.occupancy.get(targetItem.item_id)?.get(targetDay ?? 'ALL');
  if (occupants?.has(id)) conflicts.push(CONFLICT.ALREADY_HERE);

  const shift = shiftOf(targetItem);
  if (WHITEBOARD_SHIFTS.includes(shift)) {
    // 同一時段當日已有別的點位
    if (index.onShift.get(`${shift}:${targetDay}`)?.has(id) && !occupants?.has(id)) {
      conflicts.push(CONFLICT.DUPLICATE_SHIFT);
    }
    // 當日已站過同名點位（跨時段也算）
    const mySpots = index.spots.get(targetDay)?.get(id);
    if (mySpots?.has(targetItem.item_name) && !occupants?.has(id)) {
      conflicts.push(CONFLICT.SAME_LOCATION);
    }
  } else if (shift === SHIFT.DAILY) {
    const mine = index.blackboardDaily.get(targetDay)?.get(id);
    if (mine && [...mine].some((itemId) => itemId !== targetItem.item_id)) conflicts.push(CONFLICT.BLACKBOARD_DOUBLE);
    if (index.allWeek.has(id)) conflicts.push(CONFLICT.ALL_WEEK_HELD);
  } else if (shift === SHIFT.ALL_WEEK) {
    const mine = index.allWeek.get(id);
    if (mine && [...mine].some((itemId) => itemId !== targetItem.item_id)) conflicts.push(CONFLICT.ALL_WEEK_HELD);
  }

  return [...new Set(conflicts)];
}

function dimensionOf(item) {
  switch (shiftOf(item)) {
    case SHIFT.MORNING: return DIMENSION.MORNING;
    case SHIFT.FLAG: return DIMENSION.FLAG;
    case SHIFT.NOON: return DIMENSION.NOON;
    default: return DIMENSION.BLACKBOARD;
  }
}

/**
 * Plan X 補位推薦。
 *
 * 排序：無衝突優先 → 該維度歷史次數少者優先
 *      → 本週指派次數少者優先 → staff_id。
 *
 * @returns {Array<{staff_id, name, conflicts, historyCount, weekAssigned}>}
 */
function recommendReplacements({
  staff, targetItem, targetDay, rows, itemsById, stats = new Map(),
  absences = [], weekStartDate, excludeStaffId = null, limit = 8,
}) {
  const index = buildBoardIndex(rows, itemsById);
  const absentSet = absentDays(absences, weekStartDate);
  const dimension = dimensionOf(targetItem);
  const statKey = DIMENSION_COLUMN[dimension];

  const scored = staff
    .filter((s) => s.staff_id !== excludeStaffId)
    .map((s) => {
      const conflicts = checkConflicts({ candidate: s, targetItem, targetDay, index, absentSet });
      const stat = stats.get(s.staff_id) ?? {};
      return {
        staff_id: s.staff_id,
        name: s.name,
        staff_group: s.staff_group,
        role: s.role,
        conflicts,
        historyCount: stat[statKey] ?? 0,
        weekAssigned: index.weekAssigned.get(s.staff_id) ?? 0,
      };
    })
    // 徒弟不排班，直接不列入；已在同一點位者也不列入
    .filter((c) => !c.conflicts.includes(CONFLICT.ALREADY_HERE))
    .filter((c) => !c.conflicts.includes(CONFLICT.APPRENTICE));

  scored.sort((a, b) => {
    if ((a.conflicts.length === 0) !== (b.conflicts.length === 0)) return a.conflicts.length === 0 ? -1 : 1;
    if (a.conflicts.length !== b.conflicts.length) return a.conflicts.length - b.conflicts.length;
    if (a.historyCount !== b.historyCount) return a.historyCount - b.historyCount;
    if (a.weekAssigned !== b.weekAssigned) return a.weekAssigned - b.weekAssigned;
    return a.staff_id - b.staff_id;
  });

  return scored.slice(0, limit);
}

/* ============================================================
   資料層 —— 取代原本的 SQLite + REST API
   同一份領域邏輯（排班引擎、公平性、Plan X）原封不動沿用，
   只把「資料放哪裡」換成 Artifact 的 db 能力，
   沒有 db 時退回瀏覽器本機儲存。
   ============================================================ */

const STORAGE_KEY = 'dual-board-v1';

const STATE = {
  staff: [],
  items: [],
  fairness: {},          // staff_id -> 累計次數
  weeks: {},             // 'YYYY-MM-DD' -> { status, rows, absences, ledger, ... }
  nextIds: { staff: 1, item: 1, detail: 1, absence: 1 },
};

let remoteDb = null;     // claude.use('db') 的結果，null 代表只能用本機
let loadedWeeks = new Set();

const clone = (v) => JSON.parse(JSON.stringify(v));

/* ---------- 持久化 ---------- */

function localRead(key) {
  try {
    const raw = localStorage.getItem(`${STORAGE_KEY}:${key}`);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}

function localWrite(key, value) {
  try { localStorage.setItem(`${STORAGE_KEY}:${key}`, JSON.stringify(value)); } catch { /* 私密瀏覽或空間不足 */ }
}

async function readDoc(path) {
  if (remoteDb) {
    try {
      const snap = await remoteDb.doc(path).get();
      if (snap?.exists) return snap.data();
    } catch { /* 讀不到就退回本機 */ }
  }
  return localRead(path);
}

async function writeDoc(path, value) {
  localWrite(path, value);
  if (remoteDb) {
    try { await remoteDb.doc(path).set(value); } catch { /* 寫不進去至少本機還在 */ }
  }
}

const configDoc = () => ({
  staff: STATE.staff, items: STATE.items, fairness: STATE.fairness, nextIds: STATE.nextIds,
});

const weekDoc = (week) => STATE.weeks[week] ?? null;

async function saveConfig() { await writeDoc('app/config', configDoc()); }

async function saveWeek(week) {
  if (STATE.weeks[week]) await writeDoc(`weeks/${week}`, STATE.weeks[week]);
}

/**
 * 開機：連上 db（若有），載入設定。
 * 完全沒有存過任何東西時（第一次打開）用內建的名冊與點位起頭，
 * 不然使用者一進來要手動建 42 個點位、69 個人。
 */
async function initStore() {
  try { remoteDb = await window.claude?.use?.('db') ?? null; } catch { remoteDb = null; }

  const config = await readDoc('app/config');
  if (config) {
    STATE.staff = config.staff ?? [];
    STATE.items = config.items ?? [];
    STATE.fairness = config.fairness ?? {};
    STATE.nextIds = { staff: 1, item: 1, detail: 1, absence: 1, ...(config.nextIds ?? {}) };
    return { synced: Boolean(remoteDb), seeded: false };
  }

  if (typeof BUILT_IN_SEED !== 'undefined' && BUILT_IN_SEED) {
    STATE.staff = clone(BUILT_IN_SEED.staff);
    STATE.items = clone(BUILT_IN_SEED.items);
    STATE.fairness = Object.fromEntries(STATE.staff.map((s) => [s.staff_id, blankStat()]));
    STATE.nextIds = {
      staff: Math.max(0, ...STATE.staff.map((s) => s.staff_id)) + 1,
      item: Math.max(0, ...STATE.items.map((i) => i.item_id)) + 1,
      detail: 1,
      absence: 1,
    };
    await saveConfig();
    return { synced: Boolean(remoteDb), seeded: true };
  }

  return { synced: Boolean(remoteDb), seeded: false };
}

async function ensureWeekLoaded(week) {
  if (loadedWeeks.has(week)) return;
  const doc = await readDoc(`weeks/${week}`);
  if (doc) STATE.weeks[week] = doc;
  loadedWeeks.add(week);
}

const nextId = (kind) => { const id = STATE.nextIds[kind]; STATE.nextIds[kind] = id + 1; return id; };

/* ---------- 查詢（對應原本的 repository） ---------- */

const sortedStaff = () => [...STATE.staff].sort((a, b) => a.sort_order - b.sort_order || a.staff_id - b.staff_id);

const sortedItems = () => [...STATE.items].sort((a, b) => (
  a.board_type.localeCompare(b.board_type)
  || a.shift_type.localeCompare(b.shift_type)
  || a.sort_order - b.sort_order
  || a.item_id - b.item_id
));

function blankStat() {
  return {
    blackboard_count: 0,
    morning_whiteboard_count: 0,
    flag_whiteboard_count: 0,
    noon_whiteboard_count: 0,
  };
}

const statOf = (staffId) => {
  if (!STATE.fairness[staffId]) STATE.fairness[staffId] = blankStat();
  return STATE.fairness[staffId];
};

const listFairness = () => sortedStaff().map((s) => ({
  staff_id: s.staff_id, name: s.name, staff_group: s.staff_group, role: s.role, is_active: s.is_active,
  ...blankStat(), ...(STATE.fairness[s.staff_id] ?? {}),
}));

function listGroups() {
  const order = new Map();
  const totals = new Map();
  for (const s of sortedStaff()) {
    if (!s.staff_group) continue;
    if (!order.has(s.staff_group)) order.set(s.staff_group, s.sort_order);
    const t = totals.get(s.staff_group) ?? { name: s.staff_group, total: 0, active_total: 0, master_total: 0 };
    t.total += 1;
    if (s.is_active) t.active_total += 1;
    if (s.role === 'MASTER') t.master_total += 1;
    totals.set(s.staff_group, t);
  }
  return [...totals.values()].sort((a, b) => order.get(a.name) - order.get(b.name));
}

const countMasters = () => STATE.staff.filter((s) => s.is_active && s.role === 'MASTER').length;

const countPublishedWeeks = () => Object.values(STATE.weeks).filter((w) => w.status === 'PUBLISHED').length;

function ensureWeek(week) {
  if (!STATE.weeks[week]) {
    STATE.weeks[week] = {
      week_start_date: week, status: 'DRAFT', generated_at: null, published_at: null,
      rows: [], absences: [], ledger: {},
    };
  }
  return STATE.weeks[week];
}

const findRow = (week, detailId) => ensureWeek(week).rows.find((r) => r.detail_id === detailId) ?? null;

/** 全域搜尋某個名額屬於哪一週（前端只會操作當前週，但保險起見）。 */
function locateRow(detailId) {
  for (const [week, data] of Object.entries(STATE.weeks)) {
    const row = data.rows.find((r) => r.detail_id === detailId);
    if (row) return { week, row };
  }
  return null;
}

/* ---------- 備份 ---------- */

const BACKUP_FORMAT = 'dual-board-backup';
const BACKUP_VERSION = 1;

function exportAll() {
  return {
    format: BACKUP_FORMAT,
    version: BACKUP_VERSION,
    exported_at: new Date().toISOString(),
    staff: clone(STATE.staff),
    items: clone(STATE.items),
    fairness: clone(STATE.fairness),
    weeks: clone(STATE.weeks),
  };
}

/** 匯入會整份取代現有資料，不做合併——合併規則沒有正確答案，覆蓋才可預期。 */
async function importAll(data) {
  if (data?.format !== BACKUP_FORMAT) throw new Error('這不是雙板排班的備份檔');
  if (!Array.isArray(data.staff) || !Array.isArray(data.items)) throw new Error('備份檔內容不完整');

  STATE.staff = data.staff;
  STATE.items = data.items;
  STATE.fairness = data.fairness ?? {};
  STATE.weeks = data.weeks ?? {};

  // 沿用備份裡的最大編號往下發，避免與既有資料撞號
  const maxOf = (list, key) => Math.max(0, ...list.map((x) => x[key] ?? 0));
  const allRows = Object.values(STATE.weeks).flatMap((w) => w.rows ?? []);
  const allAbsences = Object.values(STATE.weeks).flatMap((w) => w.absences ?? []);
  STATE.nextIds = {
    staff: maxOf(STATE.staff, 'staff_id') + 1,
    item: maxOf(STATE.items, 'item_id') + 1,
    detail: maxOf(allRows, 'detail_id') + 1,
    absence: maxOf(allAbsences, 'absence_id') + 1,
  };

  loadedWeeks = new Set(Object.keys(STATE.weeks));
  await saveConfig();
  await Promise.all(Object.keys(STATE.weeks).map((week) => saveWeek(week)));

  return { staff: STATE.staff.length, items: STATE.items.length, weeks: Object.keys(STATE.weeks).length };
}


/* ============================================================
   服務層 —— 生成、覆寫、補位、發布結算
   與伺服器版同一套規則，只是資料改從 STATE 讀寫。
   ============================================================ */

const nowIso = () => new Date().toISOString();

const weekRange = (week) => ({ from: week, to: dateForDay(week, 5) });

function absencesForWeek(week) {
  const { from, to } = weekRange(week);
  const names = new Map(STATE.staff.map((s) => [s.staff_id, s]));
  return ensureWeek(week).absences
    .filter((a) => a.absence_date >= from && a.absence_date <= to)
    .sort((a, b) => a.absence_date.localeCompare(b.absence_date) || a.staff_id - b.staff_id)
    .map((a) => ({
      ...a,
      name: names.get(a.staff_id)?.name ?? '（已刪除）',
      staff_group: names.get(a.staff_id)?.staff_group ?? '',
      role: names.get(a.staff_id)?.role ?? 'APPRENTICE',
      day_of_week: dayOfWeekFor(week, a.absence_date),
    }));
}

/** 一鍵自動排班。重新生成會整批覆蓋該週明細，含手動調整過的部分。 */
function generate(week) {
  const data = ensureWeek(week);
  const plan = generateWeeklyPlan({
    staff: sortedStaff(),
    items: sortedItems(),
    stats: new Map(listFairness().map((f) => [f.staff_id, f])),
    absences: absencesForWeek(week),
    weekStartDate: week,
  });

  data.rows = plan.assignments.map((a) => ({
    detail_id: nextId('detail'),
    staff_id: a.staff_id ?? null,
    item_id: a.item_id ?? null,
    day_of_week: a.day_of_week ?? null,
    is_override: false,
    slot_index: a.slot_index ?? 0,
  }));
  data.generated_at = nowIso();
  settleFairness(week);

  return { ...getWeekView(week), generationWarnings: plan.warnings };
}

/**
 * 公平性結算：先沖銷本週既有帳本，再依「已發布」狀態重新結算。
 * 因此重複發布不會重複累加，撤回發布會完整沖銷。
 */
function settleFairness(week) {
  const data = ensureWeek(week);

  for (const [staffId, delta] of Object.entries(data.ledger ?? {})) {
    const stat = statOf(Number(staffId));
    for (const [field, value] of Object.entries(delta)) {
      stat[field] = Math.max(0, (stat[field] ?? 0) - value);
    }
  }
  data.ledger = {};

  if (data.status !== 'PUBLISHED') return;

  const items = new Map(STATE.items.map((i) => [i.item_id, i]));
  const FIELD = {
    [SHIFT.MORNING]: 'morning_whiteboard_count',
    [SHIFT.FLAG]: 'flag_whiteboard_count',
    [SHIFT.NOON]: 'noon_whiteboard_count',
  };

  for (const row of data.rows) {
    if (row.staff_id == null) continue;

    const delta = data.ledger[row.staff_id] ?? (data.ledger[row.staff_id] = {});
    const bump = (field) => { delta[field] = (delta[field] ?? 0) + 1; };

    const item = items.get(row.item_id);
    if (!item) continue;
    if (item.board_type === BOARD.BLACKBOARD) bump('blackboard_count');
    else if (FIELD[item.shift_type]) bump(FIELD[item.shift_type]);
  }

  for (const [staffId, delta] of Object.entries(data.ledger)) {
    const stat = statOf(Number(staffId));
    for (const [field, value] of Object.entries(delta)) stat[field] = (stat[field] ?? 0) + value;
  }
}

function publish(week) {
  const data = ensureWeek(week);
  data.status = 'PUBLISHED';
  data.published_at = nowIso();
  settleFairness(week);
  return getWeekView(week);
}

function unpublish(week) {
  const data = ensureWeek(week);
  data.status = 'DRAFT';
  data.published_at = null;
  settleFairness(week);
  return getWeekView(week);
}

/** 手動換人。主管具 100% 強制覆寫權，衝突只回報不阻擋。 */
function overrideAssignment(detailId, staffId) {
  const found = locateRow(detailId);
  if (!found) throw new Error('班表明細不存在');
  const { week, row } = found;

  let conflicts = [];
  if (staffId != null) {
    const person = STATE.staff.find((s) => s.staff_id === staffId);
    if (!person) throw new Error('人員不存在');

    const items = new Map(STATE.items.map((i) => [i.item_id, i]));
    const targetItem = items.get(row.item_id);
    if (targetItem) {
      const others = ensureWeek(week).rows.filter((r) => r.detail_id !== detailId);
      const absentSet = new Set(
        absencesForWeek(week).filter((a) => a.day_of_week).map((a) => `${a.staff_id}:${a.day_of_week}`),
      );
      conflicts = checkConflicts({
        candidate: person,
        targetItem,
        targetDay: row.day_of_week,
        index: buildBoardIndex(others, items),
        absentSet,
      });
    }
  }

  row.staff_id = staffId ?? null;
  row.is_override = true;
  settleFairness(week);

  return {
    ...getWeekView(week),
    conflicts: conflicts.map((code) => ({ code, label: CONFLICT_LABEL[code] ?? code })),
  };
}

function swapAssignments(detailIdA, detailIdB) {
  const a = locateRow(detailIdA);
  const b = locateRow(detailIdB);
  if (!a || !b) throw new Error('班表明細不存在');
  if (a.week !== b.week) throw new Error('兩個名額不屬於同一份班表');

  const held = a.row.staff_id;
  a.row.staff_id = b.row.staff_id;
  b.row.staff_id = held;
  a.row.is_override = true;
  b.row.is_override = true;
  settleFairness(a.week);
  return getWeekView(a.week);
}

/** Plan X 補位推薦。 */
function planXRecommendations(detailId, { limit = 8 } = {}) {
  const found = locateRow(detailId);
  if (!found) throw new Error('班表明細不存在');
  const { week, row } = found;

  const items = new Map(STATE.items.map((i) => [i.item_id, i]));
  const targetItem = items.get(row.item_id);
  if (!targetItem) throw new Error('此名額沒有對應點位');

  const candidates = recommendReplacements({
    staff: sortedStaff().filter((s) => s.is_active && s.role === ROLE.MASTER),
    targetItem,
    targetDay: row.day_of_week,
    rows: ensureWeek(week).rows.filter((r) => r.detail_id !== detailId),
    itemsById: items,
    stats: new Map(listFairness().map((f) => [f.staff_id, f])),
    absences: absencesForWeek(week),
    weekStartDate: week,
    excludeStaffId: row.staff_id,
    limit,
  });

  return {
    detail_id: detailId,
    item: targetItem,
    day_of_week: row.day_of_week,
    current_staff_id: row.staff_id,
    candidates: candidates.map((c) => ({
      ...c,
      conflicts: c.conflicts.map((code) => ({ code, label: CONFLICT_LABEL[code] ?? code })),
    })),
  };
}

/**
 * 供需摘要：每人每個時段只能站一個點位，
 * 因此單一時段的名額總數不能超過可排班的師傅數。
 */
function buildCapacitySummary(items) {
  const masters = countMasters();
  const demandOf = (shift) => items
    .filter((i) => i.board_type === BOARD.WHITEBOARD && i.shift_type === shift)
    .reduce((sum, i) => sum + i.required_capacity, 0);

  const shifts = WHITEBOARD_SHIFTS.map((shift) => ({
    shift_type: shift,
    label: SHIFT_LABEL[shift] ?? shift,
    slots: demandOf(shift),
    points: items.filter((i) => i.board_type === BOARD.WHITEBOARD && i.shift_type === shift).length,
  }));
  const peak = Math.max(0, ...shifts.map((s) => s.slots));

  return {
    masters,
    shifts,
    peak_slots: peak,
    headroom: masters - peak,
    feasible: peak <= masters,
  };
}

/** 組出前端單頁所需的完整週檢視。 */
function getWeekView(week) {
  const data = ensureWeek(week);
  const items = sortedItems();
  const itemMap = new Map(items.map((i) => [i.item_id, i]));
  const dates = Object.fromEntries(WEEK_DAYS.map((d) => [d, dateForDay(week, d)]));

  const warnings = data.rows
    .filter((r) => r.staff_id == null)
    .map((r) => ({
      code: WARNING.UNDERSTAFFED,
      detail_id: r.detail_id,
      item_id: r.item_id,
      item_name: itemMap.get(r.item_id)?.item_name ?? null,
      day_of_week: r.day_of_week,
    }));

  return {
    schedule: {
      schedule_id: week,
      week_start_date: week,
      week_end_date: dates[5],
      status: data.status,
      generated_at: data.generated_at,
      published_at: data.published_at,
      dates,
      has_items: data.rows.length > 0,
    },
    staff: sortedStaff(),
    groups: listGroups(),
    items,
    assignments: data.rows.map(clone),
    absences: absencesForWeek(week),
    fairness: listFairness(),
    published_weeks: countPublishedWeeks(),
    capacity: buildCapacitySummary(items),
    warnings,
  };
}


/* ============================================================
   本機 API —— 沿用伺服器版的路徑與回傳格式，
   讓看板程式碼一行都不用改。
   ============================================================ */

const bad = (message) => { throw new Error(message); };

function requireName(value, field = '名稱') {
  const name = String(value ?? '').trim();
  if (!name) bad(`${field}不可為空`);
  if (name.length > 40) bad(`${field}不可超過 40 字`);
  return name;
}

function requireWeek(value) {
  const week = value ?? currentWeekStart();
  if (!isIsoDate(week)) bad('週次格式需為 YYYY-MM-DD');
  return mondayOf(week);
}

async function api(path, { method = 'GET', body } = {}) {
  const url = new URL(path, 'http://local');
  const query = url.searchParams;
  const parts = url.pathname.split('/').filter(Boolean).slice(1); // 去掉 'api'
  const [head, ...rest] = parts;

  /* ---- 週檢視 ---- */
  if (head === 'week' && rest.length === 0 && method === 'GET') {
    const week = requireWeek(query.get('week'));
    await ensureWeekLoaded(week);
    return getWeekView(week);
  }

  if (head === 'week' && rest[0] === 'navigate') {
    const week = requireWeek(query.get('week'));
    const target = shiftWeeks(week, Number(query.get('delta') ?? 0));
    await ensureWeekLoaded(target);
    return getWeekView(target);
  }

  if (head === 'week' && rest[0] === 'generate' && method === 'POST') {
    const week = requireWeek(body?.week);
    await ensureWeekLoaded(week);
    if (STATE.items.length === 0) bad('還沒有任何點位，請先到設定新增');
    if (countMasters() === 0) bad('還沒有可排班的師傅，請先到設定新增或把徒弟升級');
    const view = generate(week);
    await Promise.all([saveWeek(week), saveConfig()]);
    return view;
  }

  /* ---- 發布 / 撤回 ---- */
  if (head === 'schedules' && (rest[1] === 'publish' || rest[1] === 'unpublish')) {
    const week = requireWeek(rest[0]);
    await ensureWeekLoaded(week);
    const view = rest[1] === 'publish' ? publish(week) : unpublish(week);
    await Promise.all([saveWeek(week), saveConfig()]);
    return view;
  }

  /* ---- 名額覆寫 / 互換 / Plan X ---- */
  if (head === 'assignments' && rest[0] === 'swap' && method === 'POST') {
    const view = swapAssignments(Number(body.detail_id_a), Number(body.detail_id_b));
    await Promise.all([saveWeek(view.schedule.week_start_date), saveConfig()]);
    return view;
  }

  if (head === 'assignments' && rest[1] === 'plan-x') {
    return planXRecommendations(Number(rest[0]), { limit: Number(query.get('limit') ?? 8) });
  }

  if (head === 'assignments' && rest.length === 1 && method === 'PATCH') {
    const staffId = body.staff_id === null || body.staff_id === undefined ? null : Number(body.staff_id);
    const view = overrideAssignment(Number(rest[0]), staffId);
    await Promise.all([saveWeek(view.schedule.week_start_date), saveConfig()]);
    return view;
  }

  /* ---- 公差 / 請假 ---- */
  if (head === 'absences' && method === 'POST') {
    if (!isIsoDate(body.absence_date)) bad('日期格式需為 YYYY-MM-DD');
    const type = body.absence_type ?? 'OFFICIAL';
    if (!['OFFICIAL', 'LEAVE'].includes(type)) bad('類型需為公差或請假');

    const week = mondayOf(body.absence_date);
    await ensureWeekLoaded(week);
    const data = ensureWeek(week);
    const staffId = Number(body.staff_id);

    const existing = data.absences.find((a) => a.staff_id === staffId && a.absence_date === body.absence_date);
    if (existing) Object.assign(existing, { absence_type: type, note: body.note ?? null });
    else {
      data.absences.push({
        absence_id: nextId('absence'), staff_id: staffId,
        absence_date: body.absence_date, absence_type: type, note: body.note ?? null,
      });
    }
    await saveWeek(week);
    return getWeekView(week);
  }

  if (head === 'absences' && method === 'DELETE') {
    const week = requireWeek(query.get('week'));
    await ensureWeekLoaded(week);
    const data = ensureWeek(week);
    data.absences = data.absences.filter((a) => a.absence_id !== Number(rest[0]));
    await saveWeek(week);
    return getWeekView(week);
  }

  /* ---- 備份 ---- */
  if (head === 'backup' && method === 'GET') return exportAll();

  if (head === 'backup' && method === 'POST') {
    const summary = await importAll(body);
    return { imported: summary };
  }

  /* ---- 點位設定 ---- */
  if (head === 'items' && method === 'GET') return { items: sortedItems() };

  if (head === 'items' && method === 'POST') {
    const boardType = body.board_type;
    const shiftType = body.shift_type;
    if (!Object.values(BOARD).includes(boardType)) bad('板別不正確');
    if (boardType === BOARD.WHITEBOARD && !WHITEBOARD_SHIFTS.includes(shiftType)) bad('白板時段需為早修／升旗／午休');
    if (boardType === BOARD.BLACKBOARD && ![SHIFT.ALL_WEEK, SHIFT.DAILY].includes(shiftType)) bad('黑板時段不正確');

    const capacity = Number(body.required_capacity ?? 1);
    if (!Number.isInteger(capacity) || capacity < 1 || capacity > 20) bad('人數需介於 1~20');

    const zone = String(body.zone ?? '').trim();
    if (zone && !Object.values(ZONE).includes(zone)) bad('分區需為定點或巡查');

    const itemName = requireName(body.item_name, '點位名稱');
    if (STATE.items.some((i) => i.board_type === boardType && i.shift_type === shiftType && i.item_name === itemName)) {
      bad('這個時段已經有同名點位');
    }

    const sameShift = STATE.items.filter((i) => i.board_type === boardType && i.shift_type === shiftType);
    const itemId = nextId('item');
    STATE.items.push({
      item_id: itemId,
      board_type: boardType,
      shift_type: shiftType,
      item_name: itemName,
      required_capacity: capacity,
      zone,
      sort_order: Math.max(0, ...sameShift.map((i) => i.sort_order)) + 10,
    });
    await saveConfig();
    return { item_id: itemId, items: sortedItems() };
  }

  if (head === 'items' && method === 'PATCH') {
    const item = STATE.items.find((i) => i.item_id === Number(rest[0]));
    if (!item) bad('點位不存在');

    if (body.item_name !== undefined) {
      const itemName = requireName(body.item_name, '點位名稱');
      if (STATE.items.some((i) => i.item_id !== item.item_id
        && i.board_type === item.board_type && i.shift_type === item.shift_type && i.item_name === itemName)) {
        bad('這個時段已經有同名點位');
      }
      item.item_name = itemName;
    }
    if (body.required_capacity !== undefined) {
      const capacity = Number(body.required_capacity);
      if (!Number.isInteger(capacity) || capacity < 1 || capacity > 20) bad('人數需介於 1~20');
      item.required_capacity = capacity;
    }
    if (body.zone !== undefined) {
      const zone = String(body.zone).trim();
      if (zone && !Object.values(ZONE).includes(zone)) bad('分區需為定點或巡查');
      item.zone = zone;
    }
    if (body.sort_order !== undefined) item.sort_order = Number(body.sort_order);

    await saveConfig();
    return { items: sortedItems() };
  }

  if (head === 'items' && method === 'DELETE') {
    const itemId = Number(rest[0]);
    if (!STATE.items.some((i) => i.item_id === itemId)) bad('點位不存在');

    let removed = 0;
    for (const [week, data] of Object.entries(STATE.weeks)) {
      const before = data.rows.length;
      data.rows = data.rows.filter((r) => r.item_id !== itemId);
      if (data.rows.length !== before) { removed += before - data.rows.length; await saveWeek(week); }
    }
    STATE.items = STATE.items.filter((i) => i.item_id !== itemId);
    await saveConfig();
    return { items: sortedItems(), removed_assignments: removed };
  }

  /* ---- 人員設定 ---- */
  if (head === 'staff' && method === 'GET') {
    return { staff: sortedStaff(), groups: listGroups(), fairness: listFairness() };
  }

  if (head === 'staff' && method === 'POST') {
    const role = body.role ?? ROLE.APPRENTICE;
    if (!Object.values(ROLE).includes(role)) bad('身分需為師傅或徒弟');

    const staffId = nextId('staff');
    STATE.staff.push({
      staff_id: staffId,
      name: requireName(body.name, '姓名'),
      staff_group: String(body.staff_group ?? '').trim(),
      role,
      is_active: true,
      sort_order: Math.max(0, ...STATE.staff.map((s) => s.sort_order)) + 1,
    });
    STATE.fairness[staffId] = blankStat();
    await saveConfig();
    return { staff_id: staffId, staff: sortedStaff(), groups: listGroups() };
  }

  if (head === 'staff' && method === 'PATCH') {
    const person = STATE.staff.find((s) => s.staff_id === Number(rest[0]));
    if (!person) bad('人員不存在');

    if (body.name !== undefined) person.name = requireName(body.name, '姓名');
    if (body.role !== undefined) {
      if (!Object.values(ROLE).includes(body.role)) bad('身分需為師傅或徒弟');
      person.role = body.role;
    }
    if (body.is_active !== undefined) person.is_active = Boolean(body.is_active);

    await saveConfig();
    return { staff: sortedStaff(), groups: listGroups(), fairness: listFairness() };
  }

  if (head === 'staff' && method === 'DELETE') {
    const staffId = Number(rest[0]);
    if (!STATE.staff.some((s) => s.staff_id === staffId)) bad('人員不存在');

    let vacated = 0;
    for (const [week, data] of Object.entries(STATE.weeks)) {
      let touched = false;
      for (const row of data.rows) {
        if (row.staff_id === staffId) { row.staff_id = null; vacated += 1; touched = true; }
      }
      const before = data.absences.length;
      data.absences = data.absences.filter((a) => a.staff_id !== staffId);
      if (touched || data.absences.length !== before) await saveWeek(week);
    }
    STATE.staff = STATE.staff.filter((s) => s.staff_id !== staffId);
    delete STATE.fairness[staffId];
    await saveConfig();
    return { staff: sortedStaff(), groups: listGroups(), vacated_slots: vacated };
  }

  bad(`找不到這個操作：${path}`);
  return null;
}


/* ============================================================
   雙板動態排班系統 — 手機端單頁應用
   資料一律由後端 API 供給；前端只負責呈現與互動，不做排班計算。
   ============================================================ */

const RING_R = 32;
const RING_C = 2 * Math.PI * RING_R;
const DAY_NAMES = { 1: '一', 2: '二', 3: '三', 4: '四', 5: '五' };
const SHIFT_COLOR = { MORNING: 'var(--emerald)', FLAG: 'var(--topaz)', NOON: 'var(--amethyst)' };
/** 公平性維度 → 欄位、標籤、顏色、長條樣式 */
const DIMENSIONS = [
  { key: 'blackboard_count', label: '黑板', color: 'var(--sapphire)', bar: 'bar--bb' },
  { key: 'morning_whiteboard_count', label: '早修', color: 'var(--emerald)', bar: 'bar--am' },
  { key: 'flag_whiteboard_count', label: '升旗', color: 'var(--topaz)', bar: 'bar--fl' },
  { key: 'noon_whiteboard_count', label: '午休', color: 'var(--amethyst)', bar: 'bar--pm' },
];
const DRAG_THRESHOLD = 8;
const LONG_PRESS_MS = 180;

const state = {
  week: null,
  data: null,
  tab: 'blackboard',
  day: 1,
  shift: 'MORNING',
  itemsById: new Map(),
  staffById: new Map(),
};

const $ = (sel) => document.querySelector(sel);
const el = (tag, className, text) => {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text != null) node.textContent = text;
  return node;
};
const icon = (id, cls = 'icon') => {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', cls);
  svg.setAttribute('aria-hidden', 'true');
  const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
  use.setAttribute('href', `#${id}`);
  svg.append(use);
  return svg;
};
const todayIso = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
};
const shortDate = (iso) => `${Number(iso.slice(5, 7))}/${iso.slice(8, 10)}`;

/* ---------- 提示 ---------- */

let toastTimer;
function toast(message, tone = 'info') {
  const node = $('#toast');
  node.textContent = message;
  node.dataset.tone = tone;
  node.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { node.hidden = true; }, 3600);
}

/* ---------- 資料載入 ---------- */

function absorb(payload) {
  if (!payload?.schedule) return;
  state.data = payload;
  state.week = payload.schedule.week_start_date;
  state.itemsById = new Map(payload.items.map((i) => [i.item_id, i]));
  state.staffById = new Map(payload.staff.map((s) => [s.staff_id, s]));
  render();
}

async function loadWeek(week) {
  absorb(await api(`/api/week?week=${encodeURIComponent(week ?? state.week ?? todayIso())}`));
}

/* ---------- 查詢輔助 ---------- */

const itemsOf = (board, shift) => state.data.items
  .filter((i) => i.board_type === board && i.shift_type === shift)
  .sort((a, b) => a.sort_order - b.sort_order || a.item_id - b.item_id);

const slotsOf = (itemId, day) => state.data.assignments
  .filter((r) => r.item_id === itemId && (r.day_of_week ?? null) === (day ?? null))
  .sort((a, b) => a.slot_index - b.slot_index);

const staffName = (id) => state.staffById.get(id)?.name ?? '未指派';

const absencesOn = (day) => state.data.absences.filter((a) => a.day_of_week === day);

const isAbsent = (staffId, day) => state.data.absences
  .some((a) => a.staff_id === staffId && a.day_of_week === day);

/* ---------- 名牌 chip ---------- */

function tagEl(row, boardKind, day) {
  const node = el('button', 'tag');
  node.type = 'button';
  node.dataset.detailId = String(row.detail_id);
  node.dataset.board = boardKind;

  if (row.staff_id == null) {
    node.classList.add('tag--empty');
    node.append(icon('i-plus'), el('span', null, '補位'));
    node.setAttribute('aria-label', '空缺名額，點選以指派師傅');
    return node;
  }

  const name = staffName(row.staff_id);
  node.append(el('span', null, name));
  if (row.is_override) node.classList.add('tag--override');
  if (day && isAbsent(row.staff_id, day)) {
    node.classList.add('tag--absent');
    node.title = '該員當日有公差／請假';
  }
  const group = state.staffById.get(row.staff_id)?.staff_group;
  node.setAttribute('aria-label', `${name}${group ? `（${group}）` : ''}，點選以換人`);
  return node;
}

/* ---------- 星期條 ---------- */

function renderDayStrip() {
  const strip = $('#dayStrip');
  strip.replaceChildren();
  const today = todayIso();

  for (const day of [1, 2, 3, 4, 5]) {
    const date = state.data.schedule.dates[day];
    const chip = el('button', 'daychip');
    chip.type = 'button';
    chip.setAttribute('aria-pressed', String(day === state.day));
    if (date === today) chip.dataset.today = '1';
    chip.append(el('span', 'daychip__d', `週${DAY_NAMES[day]}`));
    chip.append(el('span', 'daychip__n mono', shortDate(date)));
    chip.setAttribute('aria-label', `週${DAY_NAMES[day]} ${date}`);
    chip.addEventListener('click', () => { state.day = day; render(); });
    strip.append(chip);
  }
  // 只有白板需要選日；黑板已是整週表格，公差與統計跟單日無關
  strip.hidden = state.tab !== 'whiteboard';
}


/* ---------- 表格 ---------- */

function table(className = '') {
  const wrap = el('div', 'tablewrap');
  const node = el('table', `sched ${className}`.trim());
  wrap.append(node);
  return { wrap, table: node };
}

function captionRow(title, meta) {
  const head = el('div', 'sched-caption');
  head.append(el('h2', null, title));
  if (meta) head.append(el('span', null, meta));
  return head;
}

/** 一格名牌；沒有名額時顯示灰底破折號。 */
function slotCell(slots, index, boardKind, day) {
  const cell = el('td');
  const slot = slots[index];
  if (!slot) { cell.append(el('span', 'cell-text', '—')); return cell; }
  cell.append(tagEl(slot, boardKind, day));
  return cell;
}

/* ---------- 視圖：黑板 ---------- */

function renderBlackboard() {
  const view = $('#view-blackboard');
  view.replaceChildren();

  if (!state.data.schedule.has_items) { view.append(emptyState()); return; }
  view.classList.add('stagger');

  const gaps = state.data.warnings.filter((w) => {
    const item = state.itemsById.get(w.item_id);
    return item && item.board_type === 'BLACKBOARD';
  });
  if (gaps.length) view.append(noticeEl(`黑板還有 ${gaps.length} 個名額待補`, 'ruby'));

  // 每日輪替職務：一列一個任務，五欄對應週一到週五
  const daily = itemsOf('BLACKBOARD', 'DAILY');
  if (daily.length) {
    view.append(captionRow('每日輪替職務', `${daily.length} 項 × 5 天`));

    const { wrap, table: node } = table('sched--week');
    const thead = el('thead');
    const headRow = el('tr');
    headRow.append(el('th', null, ''));
    for (const day of [1, 2, 3, 4, 5]) {
      const th = el('th', null, `週${DAY_NAMES[day]}`);
      th.scope = 'col';
      if (state.data.schedule.dates[day] === todayIso()) th.style.color = 'var(--ink)';
      headRow.append(th);
    }
    thead.append(headRow);
    node.append(thead);

    const tbody = el('tbody');
    for (const item of daily) {
      const row = el('tr');
      const label = el('th', null, item.item_name);

      }
      tbody.append(row);
    }
    node.append(tbody);
    view.append(wrap);
  }

  const weekly = itemsOf('BLACKBOARD', 'ALL_WEEK');

    view.append(captionRow('全週固定職務', '1 週 1 次'));

    const { wrap, table: node } = table('sched--pair');
    const tbody = el('tbody');
    for (const item of weekly) {
      const row = el('tr');
      const label = el('th', null, item.item_name);
      label.scope = 'row';
      row.append(label, slotCell(slotsOf(item.item_id, null), 0, 'BLACKBOARD', null));
      tbody.append(row);
    }
    node.append(tbody);
    view.append(wrap);
  }

  const away = state.data.absences;
  if (away.length) {
    view.append(noticeEl(`本週公差／請假：${away.map((a) => `${a.name}（週${DAY_NAMES[a.day_of_week] ?? '—'}）`).join('、')}`, 'topaz'));
  }
